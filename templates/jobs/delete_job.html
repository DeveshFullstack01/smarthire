{% extends "base.html" %}

{% block title %}
Delete Job
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-body text-center">

            <h2 class="text-danger">
                Delete Job
            </h2>

            <hr>

            <p class="fs-5">
                Are you sure you want to delete
                <strong>{{ job.title }}</strong>?
            </p>

            <form method="POST">

                {% csrf_token %}

                <button
                    type="submit"
                    class="btn btn-danger">

                    Yes, Delete

                </button>

                <a
                    href="{% url 'job-detail' job.id %}"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
