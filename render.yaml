databases:
  - name: smarthire-db
    databaseName: smarthire_db
    user: smarthire_user
    plan: free

services:
  - type: web
    name: smarthire
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput && python manage.py shell -c \"from django.contrib.auth import get_user_model as G; U=G(); u,_=U.objects.get_or_create(username='admin', defaults={'email':'admin@example.com','role':'admin'}); u.is_staff=True; u.is_superuser=True; u.is_verified=True; u.set_password('SmartHire2026'); u.save()\""
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120"
    healthCheckPath: /health/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: SECURE_SSL
        value: "True"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: DB_NAME
        fromDatabase:
          name: smarthire-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: smarthire-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: smarthire-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: smarthire-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: smarthire-db
          property: port
