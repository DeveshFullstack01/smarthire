databases:
  - name: smarthire-db
    databaseName: smarthire_db
    user: smarthire_user
    plan: free

services:
  - type: web
    name: smarthire
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput && python manage.py shell -c \"from django.contrib.auth import get_user_model as G; U=G(); u,_=U.objects.get_or_create(username='admin', defaults={'email':'admin@example.com','role':'admin'}); u.is_staff=True; u.is_superuser=True; u.is_verified=True; u.set_password('SmartHire2026'); u.save()\""
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120"
    healthCheckPath: /health/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # Renamed from SECURE_SSL -> SECURE_SSL_REDIRECT to match
      # what config/settings.py actually reads.
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: DB_NAME
        fromDatabase:
          name: smarthire-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: smarthire-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: smarthire-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: smarthire-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: smarthire-db
          property: port

      # ------------------------------------------------------------
      # Required by config/settings.py, previously missing here.
      # This is exactly why signup was failing: settings.py has no
      # fallback default for these, and send_verification_email() had
      # no error handling, so a missing/misconfigured email backend
      # crashed the whole signup request.
      # ------------------------------------------------------------

      # Used to build the verification link candidates/recruiters click.
      # Must be your real live URL, not 127.0.0.1.
      - key: FRONTEND_URL
        value: "https://smarthire-cndr.onrender.com"

      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"

      - key: EMAIL_HOST
        value: "smtp.gmail.com"

      - key: EMAIL_PORT
        value: "587"

      - key: EMAIL_USE_TLS
        value: "True"

      # sync: false means Render will NOT read a value from this file.
      # It just reserves the variable and makes you type the real
      # value once in the Render dashboard (Environment tab), so your
      # Gmail address/app-password never end up committed to git.
      - key: EMAIL_HOST_USER
        sync: false

      - key: EMAIL_HOST_PASSWORD
        sync: false